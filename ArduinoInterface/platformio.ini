[platformio]
src_dir = .
default_envs = uno_lcd1602

[env]
framework = arduino
extra_scripts = post:tools/platformio_lto.py
build_src_filter = +<*.ino> +<*.cpp> -<tests/> -<tools/>
monitor_speed = 115200
monitor_eol = LF

[env:nano]
platform = atmelavr
board = nanoatmega328

[env:nano_new_bootloader]
platform = atmelavr
board = nanoatmega328new

[env:uno_tft]
platform = atmelavr
board = uno
build_flags = -DSERVICE_KEYBOARD_TFT=1

[env:uno_lcd1602]
platform = atmelavr
board = uno
build_flags = -DSERVICE_KEYBOARD_TFT=0

[env:wemos_d1_uno32_tft]
platform = espressif32
board = wemos_d1_uno32
build_flags = -DSERVICE_KEYBOARD_TFT=1

[env:wemos_d1_uno32_lcd1602]
platform = espressif32
board = wemos_d1_uno32
build_flags = -DSERVICE_KEYBOARD_TFT=0
