[platformio]
src_dir = .
default_envs = nucleo_c542rc_lcd1602

[env]
framework = arduino
extra_scripts = post:tools/platformio_lto.py
build_src_filter = +<*.ino> +<*.cpp> -<tests/> -<tools/>
monitor_speed = 115200
monitor_eol = LF
lib_deps = arduino-libraries/LiquidCrystal@1.0.7

[nucleo_c542rc]
platform = ststm32@20.0.0
board = nucleo_c542rc
extra_scripts = pre:tools/platformio_stm32c5.py
; C542RC is available in the development core, not the packaged core.
platform_packages = framework-arduinoststm32 @ https://github.com/stm32duino/Arduino_Core_STM32.git#8c9c3758cf4a732fef6cdc07c5da337e381312e5
upload_protocol = custom
; Open-source stlink (st-flash, with STM32C5 support) must be on PATH.
upload_command = st-flash --reset write "$SOURCE" 0x08000000
build_flags =
    -DSERIAL_UART_INSTANCE=2
    -DPIN_SERIAL_RX=PA3
    -DPIN_SERIAL_TX=PA2

[env:nucleo_c542rc_lcd1602]
extends = nucleo_c542rc
build_flags =
    ${nucleo_c542rc.build_flags}
    -DSERVICE_KEYBOARD_TFT=0

[env:uno_r4_minima_lcd1602]
platform = renesas-ra
board = uno_r4_minima
build_flags = -DSERVICE_KEYBOARD_TFT=0

[env:wemos_d1_uno32_lcd1602]
platform = espressif32
board = wemos_d1_uno32
build_flags = -DSERVICE_KEYBOARD_TFT=0

[env:nano]
platform = atmelavr
board = nanoatmega328
build_flags =
    -DSERVICE_KEYBOARD_TFT=0
    -DSERVICE_KEYBOARD_SHIELD=0
    -DSERVICE_KEYBOARD_KEYPAD=0

[env:nano_new_bootloader]
platform = atmelavr
board = nanoatmega328new
build_flags = ${env:nano.build_flags}

[env:uno_lcd1602]
platform = atmelavr
board = uno
build_flags = -DSERVICE_KEYBOARD_TFT=0
